name: go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Self-hosted on the owner's MacBook (repo-level runner m1max-a2a-swarm, agreed in
    # #gha-runner-m1max): hosted runners cannot start (billing, ruling ac-R8).
    runs-on: [self-hosted, macOS, relux-a2a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
