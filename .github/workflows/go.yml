# Public-repository CI on GitHub-hosted runners only: this repository must not use
# self-hosted runners. Limit token exposure, skip fork PRs, and cancel superseded
# PR runs while allowing main runs to finish.
name: go

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'train-') || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: macos-latest
    # A hung step must not hold a PR for the 6 h default. Hosted runners are
    # smaller than the machines these budgets were measured on.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install terminal test dependencies
        run: brew install tmux
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -timeout 60m ./...
      - name: Sender identity controls
        env:
          A2A_RUN_SENDER_CONTROLS: '1'
        run: go test -p 1 ./internal/cli -run '^TestSenderInstrumentControls$' -v -timeout 40m

  test-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install terminal test dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Require terminal test dependencies
        run: |
          for tool in tmux python3; do
            command -v "$tool" >/dev/null || { echo "Missing required test dependency: $tool"; exit 1; }
          done
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Test and report skips
        shell: bash
        run: |
          set +e
          go test -race -timeout 60m -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test-linux.log"
          test_status=${PIPESTATUS[0]}
          set -e
          skipped=$(grep -c '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/go-test-linux.log" || true)
          echo "Skipped tests (including subtests): $skipped"
          exit "$test_status"

  darwin-smoke:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(startsWith(github.head_ref, 'train-') || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...

  voice-native:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'train-') || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    # Keep the existing full-suite "test" check stable. Qualify the optional
    # native linkage and affected voice contracts separately, without rerunning
    # unrelated launcher/credential fixtures a second time.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet -tags sherpa ./...
      - run: go build -tags sherpa -o .temp/voice/a2a-voice ./cmd/a2a
      - run: go test -tags sherpa -race ./internal/voice ./internal/cli -run 'TestWorkerPaths|TestPostVoice|TestVoiceConfig|TestRender|TestCapPCM|TestWaveform|TestInstall|TestExtract|TestConfigStrict|TestModelCache|TestLocalRunner' -count=1
