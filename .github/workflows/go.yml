name: go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # The platform-independent suite runs on the organisation's self-hosted Linux
    # runners (group swarma-private). Hosted runners cannot start (billing, ruling
    # ac-R8), and this job must not depend on one MacBook being online. All of the
    # group, the labels and the repository's group admission must match.
    runs-on:
      group: swarma-private
      labels: [self-hosted, Linux, X64, swarma-ci]
    # A hung step must not hold a PR for the 6 h default (2026-10-06: a cache
    # tar sat 70 min in uninterruptible I/O after the tests had passed).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner is persistent: ~/go/pkg/mod and the build cache stay on
          # disk, so archiving them into an Actions cache is pure overhead.
          cache: false
      # Fail early when the runner lacks what the suite depends on. -race needs cgo
      # and a working C compiler. The terminal fixtures need tmux, python3 and PTYs;
      # they skip when one is missing, so without this check a green run could leave
      # them out. A2A_VOICE_IT opts into the macOS-only real-voice test and must stay
      # unset here. `shell: bash` runs with -e and pipefail.
      - name: runner prerequisites
        shell: bash
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          test "$(go env CGO_ENABLED)" = 1
          read -ra cc <<<"$(go env CC)"
          test "${#cc[@]}" -gt 0
          cc_version=$("${cc[@]}" --version)
          echo "${cc_version%%$'\n'*}"
          tmux -V
          python3 --version
          test -c /dev/ptmx
          test -d /dev/pts
          test -z "${A2A_VOICE_IT:-}"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The full CLI suite took 565s in the successful base-main run39958808425;
      # Go's default 10m aggregate watchdog left only 35s for runtime variance.
      # Keep a bounded suite watchdog inside this job's existing 30m budget.
      - run: go test -race -timeout 20m ./...

  darwin:
    # The Linux test job (linux/amd64) never compiles test files built only for
    # this macOS runner (a _darwin or architecture suffix, or a build constraint),
    # so this short job runs exactly their tests. The selector takes the file list
    # from the go tool itself. It refuses an empty selection, an invalid test
    # declaration, a test-loader error and a name shared with a portable test. It
    # also refuses to run while any A2A_* variable is set, because those gate the
    # opt-in real-host tests (Keychain sentinels, the observer dry run). Packages
    # whose Darwin-only test files hold no test are compiled, not run.
    runs-on: [self-hosted, macOS, relux-a2a]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go run ./internal/ci/darwintests -run

  voice-native:
    # Keep the existing full-suite "test" check stable. Qualify the optional
    # native linkage and affected voice contracts separately, without rerunning
    # unrelated launcher/credential fixtures a second time. The native voice
    # binding is Darwin-only (sherpa_darwin.go), so this job stays on the
    # repository's macOS runner on the owner's MacBook.
    runs-on: [self-hosted, macOS, relux-a2a]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -tags sherpa ./...
      - run: go build -tags sherpa -o .temp/voice/a2a-voice ./cmd/a2a
      - run: go test -tags sherpa -race ./internal/voice ./internal/cli -run 'TestPostVoice|TestVoiceConfig|TestRender|TestCapPCM|TestWaveform|TestInstall|TestExtract|TestConfigStrict|TestModelCache|TestLocalRunner' -count=1
