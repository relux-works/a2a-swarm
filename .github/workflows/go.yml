name: go

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Self-hosted on the owner's MacBook (repo-level runner m1max-a2a-swarm, agreed in
    # #gha-runner-m1max): hosted runners cannot start (billing, ruling ac-R8).
    runs-on: [self-hosted, macOS, relux-a2a]
    # A hung step must not hold a PR for the 6 h default (2026-10-06: a cache
    # tar sat 70 min in uninterruptible I/O after the tests had passed).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner is persistent: ~/go/pkg/mod and the build cache stay on
          # disk, so archiving them into an Actions cache is pure overhead.
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The full CLI suite took 565s in the successful base-main run39958808425;
      # Go's default 10m aggregate watchdog left only 35s for runtime variance.
      # Keep a bounded suite watchdog inside this job's existing 30m budget.
      - run: go test -race -timeout 20m ./...

  test-linux:
    # Add capacity while the repo is private and the single Mac runner is queued.
    # Transitional F1 step: moving off macOS and to public-allowed labels is later.
    runs-on: [self-hosted, Linux, swarma-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Require terminal test dependencies
        run: |
          for tool in tmux python3; do
            command -v "$tool" >/dev/null || { echo "Missing required test dependency: $tool"; exit 1; }
          done
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Test and report skips
        shell: bash
        run: |
          set +e
          go test -race -timeout 20m -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test-linux.log"
          test_status=${PIPESTATUS[0]}
          set -e
          skipped=$(grep -c '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/go-test-linux.log" || true)
          echo "Skipped tests (including subtests): $skipped"
          exit "$test_status"

  voice-native:
    # Keep the existing full-suite "test" check stable. Qualify the optional
    # native linkage and affected voice contracts separately, without rerunning
    # unrelated launcher/credential fixtures a second time.
    runs-on: [self-hosted, macOS, relux-a2a]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -tags sherpa ./...
      - run: go build -tags sherpa -o .temp/voice/a2a-voice ./cmd/a2a
      - run: go test -tags sherpa -race ./internal/voice ./internal/cli -run 'TestPostVoice|TestVoiceConfig|TestRender|TestCapPCM|TestWaveform|TestInstall|TestExtract|TestConfigStrict|TestModelCache|TestLocalRunner' -count=1
