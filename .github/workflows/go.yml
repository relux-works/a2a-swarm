# Public-repository CI: exclude fork PRs from self-hosted runners, limit token
# exposure, and cancel superseded PR runs while allowing main runs to finish.
name: go

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Self-hosted on the owner's MacBook (repo-level runner m1max-a2a-swarm, agreed in
    # #gha-runner-m1max): hosted runners cannot start (billing, ruling ac-R8).
    runs-on: [self-hosted, macOS, relux-a2a]
    # A hung step must not hold a PR for the 6 h default (2026-10-06: a cache
    # tar sat 70 min in uninterruptible I/O after the tests had passed).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner is persistent: ~/go/pkg/mod and the build cache stay on
          # disk, so archiving them into an Actions cache is pure overhead.
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # internal/cli takes about 860s on main; a PR with added tests hit the
      # 20m Go test timeout at 1201s on the Mac runner. More tests are coming.
      # Allow a 28m test watchdog inside a 35m job budget.
      - run: go test -race -timeout 28m ./...

  test-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Add capacity while the repo is private and the single Mac runner is queued.
    # Transitional F1 step: moving off macOS and to public-allowed labels is later.
    runs-on: [self-hosted, Linux, swarma-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Require terminal test dependencies
        run: |
          for tool in tmux python3; do
            command -v "$tool" >/dev/null || { echo "Missing required test dependency: $tool"; exit 1; }
          done
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Test and report skips
        shell: bash
        run: |
          set +e
          go test -race -timeout 28m -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test-linux.log"
          test_status=${PIPESTATUS[0]}
          set -e
          skipped=$(grep -c '^[[:space:]]*--- SKIP:' "$RUNNER_TEMP/go-test-linux.log" || true)
          echo "Skipped tests (including subtests): $skipped"
          exit "$test_status"

  voice-native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Keep the existing full-suite "test" check stable. Qualify the optional
    # native linkage and affected voice contracts separately, without rerunning
    # unrelated launcher/credential fixtures a second time.
    runs-on: [self-hosted, macOS, relux-a2a]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet -tags sherpa ./...
      - run: go run ./cmd/a2a-voice-release -out .temp/voice/release-1
      - run: go run ./cmd/a2a-voice-release -out .temp/voice/release-2
      - run: diff .temp/voice/release-1/MANIFEST.sha256 .temp/voice/release-2/MANIFEST.sha256
      - run: go test -tags sherpa -race ./internal/voice ./internal/voiceworker ./internal/voicerelease ./internal/cli -run 'TestPostVoice|TestVoiceConfig|TestRender|TestCapPCM|TestWaveform|TestInstall|TestExtract|TestConfigStrict|TestModelCache|TestLocalRunner|TestVerifyWorker|TestWorker|TestAllowedLibrary|TestBuildPreserves' -count=1
