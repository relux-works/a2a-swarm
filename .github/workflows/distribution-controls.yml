name: Distribution controls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: distribution-controls-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly -p=1
  GOWORK: 'off'
  GOENV: 'off'
jobs:
  distribution-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: 'v2.6.1'
      - name: Pinned workflow consumer validation
        run: |
          set -euo pipefail
          python3 .github/release/controller-tools.py
          "$RUNNER_TEMP/controller-tools/actionlint" -shellcheck="" -pyflakes="" .github/workflows/shared-release.yml .github/workflows/darwin-release.yml .github/workflows/distribution-controls.yml
      - name: Focused positive and negative distribution contracts
        run: go test -p 1 -parallel 2 -race -count=1 -timeout=8m ./internal/sharedrelease ./internal/cask ./internal/caskbrew ./internal/darwinrelease ./internal/releasecontroller ./cmd/a2a-cask ./cmd/a2a-distribution
      - name: Ordered controller dry-run fixtures and every stopping boundary
        env:
          A2A_CONTROLLER_DRY_REPORT: ${{ runner.temp }}/controller-dry-run.json
        run: go test -p 1 -parallel 2 -v -count=1 -run '^(TestCombinedControllerOrderedRefusals|TestControllerDryRunEvidence|TestSharedTagEventAndRetainedHold|TestCustodyProtectionConsumer)$' ./internal/releasecontroller
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: controller-dry-run
          path: ${{ runner.temp }}/controller-dry-run.json
          if-no-files-found: error
      - name: Immutable public keyless fixture, expected source and wrong-identity controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keyless-fixture"
          for name in checksums.txt checksums.txt.sig checksums.txt.pem a2a_0.1.1_darwin_arm64.tar.gz evidence.tar.gz release-evidence.json; do
            curl -fsSL --retry 2 -o "$RUNNER_TEMP/keyless-fixture/$name" "https://github.com/relux-works/a2a-swarm/releases/download/v0.1.1/$name"
          done
          A2A_PUBLIC_DOWNLOAD_FIXTURE=1 A2A_DISTRIBUTION_COSIGN_FIXTURE="$RUNNER_TEMP/keyless-fixture" go test -p 1 -parallel 2 -v -count=1 -timeout=5m -run '^(TestProductionCosignRealIdentityControls|TestRealDarwinProducerInput|TestRealPublicDownloadDigest)$' ./internal/sharedrelease
      - name: Build and vet repository distribution tools
        run: |
          set -euo pipefail
          go build -p 1 ./cmd/a2a-cask ./cmd/a2a-distribution ./cmd/a2a-release
          go vet -p 1 ./internal/releasecontroller ./internal/caskbrew ./internal/darwinrelease ./internal/sharedrelease ./internal/cask ./cmd/a2a-cask ./cmd/a2a-distribution

  linux-production-packages:
    outputs:
      artifact-id: ${{ steps.preparation.outputs.artifact-id }}
      artifact-digest: ${{ steps.preparation.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - name: Verify immutable upstream archives and executable pins before use
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          python3 .github/release/linux-tools.py
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Resolve modules before offline compilation and seal module inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "GOMODCACHE=$RUNNER_TEMP/modcache" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/buildcache" >> "$GITHUB_ENV"
          GOMODCACHE="$RUNNER_TEMP/modcache" go mod download
          GOMODCACHE="$RUNNER_TEMP/modcache" GOCACHE="$RUNNER_TEMP/buildcache" go list -m -json all > "$RUNNER_TEMP/module-inputs.json"
          GOMODCACHE="$RUNNER_TEMP/modcache" GOCACHE="$RUNNER_TEMP/buildcache" go build -p 1 -o "$RUNNER_TEMP/a2a-distribution" ./cmd/a2a-distribution
          chmod -R a-w "$RUNNER_TEMP/modcache"
          echo 'GOPROXY=off' >> "$GITHUB_ENV"
          echo 'GOSUMDB=off' >> "$GITHUB_ENV"
      - name: Real Linux preparation, SBOM subject binding and archive reproducibility
        shell: bash
        env:
          RELEASE_VERSION: '0.1.2'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          "$T/a2a-distribution" tools
          mkdir -p "$T/tool-plant"
          cp "$T/tools/goreleaser" "$T/tools/syft" "$T/tool-plant/"
          printf '\001' >> "$T/tool-plant/goreleaser"
          if PATH="$T/tool-plant:$PATH" "$T/a2a-distribution" tools > "$T/tool-plant.log" 2>&1; then
            echo 'Known-bad executable pin survived'; exit 1
          fi
          grep -Fx 'a2a-distribution: linux-tool-executable-mismatch: goreleaser' "$T/tool-plant.log"
          goreleaser --version
          syft version
          goreleaser check --config release/linux.goreleaser.yml
          git archive --format=tar HEAD > "$T/source.tar"
          revision=$(git rev-parse HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          goreleaser release --config release/linux.goreleaser.yml --snapshot --clean --parallelism 2 --skip=publish,announce,sign > "$T/linux-build-01.log" 2>&1
          "$T/a2a-distribution" linux -qualification -tag v0.1.2 -commit "$revision" -tag-object "$revision" -epoch "$epoch" -source-archive "$T/source.tar" -out "$T/linux-first"
          # Different filesystem mtimes were the observed LICENSE/NOTICE drift.
          # Rebuild the real archives with every documentation mtime changed.
          touch -t 200101010101 LICENSE NOTICE release/INSTALL-linux.md
          goreleaser release --config release/linux.goreleaser.yml --snapshot --clean --parallelism 2 --skip=publish,announce,sign > "$T/linux-build-02.log" 2>&1
          "$T/a2a-distribution" linux -qualification -tag v0.1.2 -commit "$revision" -tag-object "$revision" -epoch "$epoch" -source-archive "$T/source.tar" -out "$T/linux-second"
          for arch in amd64 arm64; do
            cmp "$T/linux-first/a2a_0.1.2_linux_$arch.tar.gz" "$T/linux-second/a2a_0.1.2_linux_$arch.tar.gz"
          done
          # Qualification deliberately has no OIDC/signing authority. Its
          # evidence cannot be accepted as production manifest input.
          test ! -e "$T/linux-second/linux-checksums.txt.sig"
          test ! -e "$T/linux-second/linux-checksums.txt.pem"
      - name: Real package header-only permission regressions
        shell: bash
        env:
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/linux-second/linux-release-evidence.json"
          test -f "$RUNNER_TEMP/source.tar"
          A2A_PACKAGE_CONTROL_BUNDLE="$RUNNER_TEMP/linux-second" A2A_PACKAGE_CONTROL_SOURCE="$RUNNER_TEMP/source.tar" \
            go test -p 1 -parallel 2 -v -count=1 -timeout=8m \
            -run '^(TestReviewerRealPackageControls|TestReviewerRPMHeaderModes|TestReviewerManifestIndependentNegatives|TestRPMHeaderOnlySetuidRealPackage|TestRPMHeaderOnlyNonExecutableRealPackage|TestDebSetuidTarModeRealPackage)$' ./internal/sharedrelease
      - name: deb/rpm install and removal in disposable offline containers
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          IN="$T/linux-second"
          DEB=debian@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
          RPM=fedora@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d
          docker pull "$DEB"
          docker pull "$RPM"
          mkdir -p "$IN/ref-amd64" "$IN/ref-arm64"
          for arch in amd64 arm64; do tar -xzf "$IN/a2a_0.1.2_linux_$arch.tar.gz" -C "$IN/ref-$arch" a2a; done
          S="$GITHUB_WORKSPACE/.github/cask-qualification/pkg_check.sh"
          docker run --rm --network none -v "$IN:/in:ro" -v "$S:/check.sh:ro" "$DEB" sh /check.sh deb /in/a2a_0.1.2_amd64.deb /in/ref-amd64/a2a
          docker run --rm --network none -v "$IN:/in:ro" -v "$S:/check.sh:ro" "$RPM" sh /check.sh rpm /in/a2a-0.1.2-1.x86_64.rpm /in/ref-amd64/a2a
          docker run --rm --network none -v "$IN:/in:ro" -v "$S:/check.sh:ro" "$RPM" sh /check.sh rpm-meta /in/a2a-0.1.2-1.aarch64.rpm /in/ref-arm64/a2a aarch64
          # Known-bad control: correct package against the other architecture's
          # reference must hit the binary digest gate, not an install failure.
          if docker run --rm --network none -v "$IN:/in:ro" -v "$S:/check.sh:ro" "$DEB" sh /check.sh deb /in/a2a_0.1.2_amd64.deb /in/ref-arm64/a2a > "$T/package-plant.log" 2>&1; then
            echo 'Known-bad package control survived'; exit 1
          fi
          grep -F 'differs from' "$T/package-plant.log"
          rm -r "$IN/ref-amd64" "$IN/ref-arm64"
      - name: Preserve only selected SBOM diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom-diagnostics"
          for name in a2a_0.1.2_linux_amd64.tar.gz a2a_0.1.2_linux_arm64.tar.gz a2a_0.1.2_amd64.deb a2a_0.1.2_arm64.deb a2a-0.1.2-1.x86_64.rpm a2a-0.1.2-1.aarch64.rpm; do
            if test -f "dist/$name.sbom.json"; then cp "dist/$name.sbom.json" "$RUNNER_TEMP/sbom-diagnostics/"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: preparation
        if: always()
        with:
          name: linux-production-preparation-${{ github.sha }}
          # Exact selected members only: no complete dist, cache or signing dir.
          path: |
            ${{ runner.temp }}/linux-second/a2a_0.1.2_linux_amd64.tar.gz
            ${{ runner.temp }}/linux-second/a2a_0.1.2_linux_arm64.tar.gz
            ${{ runner.temp }}/linux-second/a2a_0.1.2_amd64.deb
            ${{ runner.temp }}/linux-second/a2a_0.1.2_arm64.deb
            ${{ runner.temp }}/linux-second/a2a-0.1.2-1.x86_64.rpm
            ${{ runner.temp }}/linux-second/a2a-0.1.2-1.aarch64.rpm
            ${{ runner.temp }}/linux-second/*.sbom.json
            ${{ runner.temp }}/linux-second/linux-checksums.txt
            ${{ runner.temp }}/linux-second/linux-release-evidence.json
            ${{ runner.temp }}/linux-build-01.log
            ${{ runner.temp }}/linux-build-02.log
            ${{ runner.temp }}/package-plant.log
            ${{ runner.temp }}/tool-plant.log
            ${{ runner.temp }}/sbom-diagnostics
          if-no-files-found: error
          retention-days: 7

  macos-crossbuild:
    permissions:
      contents: read
      actions: read
    needs: linux-production-packages
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        with:
          cosign-release: 'v2.6.1'
      - name: Immutable notarised bundle native input verification
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          python3 - <<'PYFIXTURE'
          import hashlib,json,os,pathlib,urllib.request
          pin=json.load(open('release/darwin-fixture.json'))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-bundle';out.mkdir()
          for name,digest in pin['assets'].items():
              raw=urllib.request.urlopen('https://github.com/relux-works/a2a-swarm/releases/download/'+pin['tag']+'/'+name).read()
              assert hashlib.sha256(raw).hexdigest()==digest, name+' immutable fixture digest'
              (out/name).write_bytes(raw)
          PYFIXTURE
          A2A_NATIVE_PREPARED_FIXTURE="$RUNNER_TEMP/native-bundle" go test -p 1 -parallel 2 -v -count=1 -run '^TestPreparedDarwinBundleNative$' ./internal/darwinrelease
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.linux-production-packages.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-input
      - name: Real immutable artifact service ZIP consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          A2A_DOWNLOAD_ARTIFACT_ID: ${{ needs.linux-production-packages.outputs.artifact-id }}
          A2A_DOWNLOAD_ARTIFACT_SHA256: ${{ needs.linux-production-packages.outputs.artifact-digest }}
        run: go test -p 1 -parallel 2 -v -count=1 -timeout=3m -run '^TestRealArtifactDownload$' ./internal/darwinrelease
      - name: Independent offline macOS Linux builds and exact-byte refusal controls
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          test -n '${{ needs.linux-production-packages.outputs.artifact-id }}'
          test -n '${{ needs.linux-production-packages.outputs.artifact-digest }}'
          export GOMODCACHE="$T/independent-modules" GOCACHE="$T/independent-cache"
          go mod download
          go build -p 1 -o "$T/a2a-distribution" ./cmd/a2a-distribution
          git archive --format=tar HEAD > "$T/source.tar"
          revision=$(git rev-parse HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          chmod -R a-w "$GOMODCACHE"
          export GOPROXY=off GOSUMDB=off
          for arch in amd64 arm64; do
            "$T/a2a-distribution" crossbuild -tag v0.1.2 -commit "$revision" -tag-object "$revision" -epoch "$epoch" -source-archive "$T/source.tar" -dist "$T/linux-input/linux-second" -out "$T/cross-$arch" -arch "$arch"
          done
          A2A_CROSSBUILD_ROOT="$GITHUB_WORKSPACE" A2A_CROSSBUILD_BUNDLE="$T/linux-input/linux-second" go test -p 1 -parallel 2 -v -count=1 -run '^TestIndependentLinuxByteControl$' ./internal/sharedrelease

  brew-installer-controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - name: Real pinned Homebrew effective installer fields and known-bad casks
        run: .github/distribution-controls/brew-fields.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: brew-installer-controls-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/brew-controls/info-*.json
            ${{ runner.temp }}/brew-controls/result-*.log
          if-no-files-found: error

  cask-target-mutation:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - name: Cask resolved-target gate detects its narrowing mutant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYMUTANT'
          import json,os,pathlib
          source=pathlib.Path('internal/caskbrew/verify.go').resolve()
          before=source.read_text();needle='target != filepath.Join(prefix, "bin", n)'
          assert before.count(needle)==1, 'resolved-target mutant must apply exactly once'
          mutant=pathlib.Path(os.environ['RUNNER_TEMP'])/'cask-target-mutant.go'
          mutant.write_text(before.replace(needle,'false'))
          (mutant.parent/'cask-target-overlay.json').write_text(json.dumps({'Replace':{str(source):str(mutant)}}))
          PYMUTANT
          set +e
          go test -p 1 -parallel 2 -overlay "$RUNNER_TEMP/cask-target-overlay.json" -count=1 -run '^TestBrewInstallerFields/binary-target$' ./internal/caskbrew > "$RUNNER_TEMP/cask-target-mutant.log" 2>&1
          mutant_exit=$?
          set -e
          cat "$RUNNER_TEMP/cask-target-mutant.log"
          test "$mutant_exit" -eq 1
          grep -F -- '--- FAIL: TestBrewInstallerFields/binary-target' "$RUNNER_TEMP/cask-target-mutant.log"
          grep -F -- 'want brew-effective-binary-target, got <nil>' "$RUNNER_TEMP/cask-target-mutant.log"

  rpm-header-mode-mutation:
    # Run with the fixture even if the producer's ordinary tests failed.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: linux-production-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - name: Require the package fixture
        env:
          ARTIFACT_ID: ${{ needs.linux-production-packages.outputs.artifact-id }}
        run: test -n "$ARTIFACT_ID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.linux-production-packages.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/package-input
      - name: Prepare exact source archive and offline modules
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
          go mod download
      - name: Header-only package regressions detect their narrowing mutant
        shell: bash
        env:
          GOMAXPROCS: '2'
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/package-input/linux-second/linux-release-evidence.json"
          # A narrowing mutant replaces only authoritative FILEMODES with 0755;
          # filename/owner/CPIO checks remain. Both real header-only tests must
          # fail because the unsafe package was accepted, not because setup broke.
          python3 - <<'PY'
          import json,os,pathlib
          source=pathlib.Path('internal/sharedrelease/packages.go').resolve()
          text=source.read_text()
          needle='installMode, e := rpmInstallFile(tags)'
          assert text.count(needle)==1
          mutant=pathlib.Path(os.environ['RUNNER_TEMP'])/'rpm-header-mode-mutant.go'
          mutant.write_text(text.replace(needle,'tags[1030] = rpmValue{kind: 3, count: 1, data: []byte{0x81, 0xed}}\n\t'+needle))
          overlay=pathlib.Path(os.environ['RUNNER_TEMP'])/'rpm-header-mode-overlay.json'
          overlay.write_text(json.dumps({'Replace':{str(source):str(mutant)}}))
          PY
          if A2A_PACKAGE_CONTROL_BUNDLE="$RUNNER_TEMP/package-input/linux-second" A2A_PACKAGE_CONTROL_SOURCE="$RUNNER_TEMP/source.tar" \
            go test -p 1 -parallel 2 -v -count=1 -timeout=8m -overlay "$RUNNER_TEMP/rpm-header-mode-overlay.json" \
            -run '^TestRPMHeaderOnly(Setuid|NonExecutable)RealPackage$' ./internal/sharedrelease > "$RUNNER_TEMP/rpm-header-mode-mutant.log" 2>&1; then
            echo 'Authoritative-header-mode mutant survived'; exit 1
          fi
          grep -F -- '--- FAIL: TestRPMHeaderOnlySetuidRealPackage ' "$RUNNER_TEMP/rpm-header-mode-mutant.log"
          grep -F -- '--- FAIL: TestRPMHeaderOnlyNonExecutableRealPackage ' "$RUNNER_TEMP/rpm-header-mode-mutant.log"
          test "$(grep -cF 'expected mode/owner refusal before output, got <nil>' "$RUNNER_TEMP/rpm-header-mode-mutant.log")" = 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rpm-header-mode-mutation
          path: ${{ runner.temp }}/rpm-header-mode-mutant.log
          if-no-files-found: error
          retention-days: 7
